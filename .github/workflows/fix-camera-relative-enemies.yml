name: Apply camera-relative enemy spawn fix

on:
  push:
    branches: [main]
    paths: [.github/workflows/fix-camera-relative-enemies.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch enemy spawn coordinates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()

          old = '''  }else{\n    x=side<0?W+28:-28;\n    const highEntry=Math.random()<(ramp*.62);\n    if(highEntry){\n      y=rnd(H*.20,H*.32);\n    }else if(player.alive){\n      // Early encounters enter around the rider's height or a little below,\n      // rather than beginning with a free winning position.\n      y=clamp(player.y+rnd(-H*.015,H*.11),H*.31,H*.57);\n    }else{\n      y=rnd(H*.34,H*.52);\n    }\n  }\n'''

          new = '''  }else{\n    x=side<0?W+28:-28;\n    // Spawn into the camera's current world-space window. Platforms remain\n    // fixed in the original arena, but knights must still enter where the\n    // player can actually see and engage them during an elevated joust.\n    const viewTop=cameraY;\n    const highEntry=Math.random()<(ramp*.62);\n    if(highEntry){\n      y=rnd(viewTop+H*.20,viewTop+H*.32);\n    }else if(player.alive){\n      // Early encounters enter around the rider's height or a little below,\n      // rather than beginning with a free winning position.\n      y=clamp(player.y+rnd(-H*.015,H*.11),viewTop+H*.31,viewTop+H*.57);\n    }else{\n      y=rnd(viewTop+H*.34,viewTop+H*.52);\n    }\n  }\n'''

          if s.count(old) != 1:
              raise SystemExit('expected one spawn block')
          p.write_text(s.replace(old, new, 1))
          PY

          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          js=s.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/tiny-joust.js').write_text(js)
          PY
          node --check /tmp/tiny-joust.js
          rm .github/workflows/fix-camera-relative-enemies.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Keep normal enemies in elevated camera view [skip ci]"
          git push
