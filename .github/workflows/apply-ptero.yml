name: Apply pterodactyl patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Tiny Joust
        run: python .github/apply-ptero.py
      - name: Check JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text()
          js = s.split('<script>', 1)[1].split('</script>', 1)[0]
          Path('/tmp/tiny-joust.js').write_text(js)
          PY
          node --check /tmp/tiny-joust.js
      - name: Commit patch and clean helper files
        shell: bash
        run: |
          rm .github/workflows/apply-ptero.yml .github/apply-ptero.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add pterodactyl anti-stall pressure [skip ci]"
          git push
